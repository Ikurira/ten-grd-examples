name: examples
on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # Weekly: catch breakage from new upstream releases.

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Bootstrap verified pip and certificate constraints
        shell: bash
        run: |
          python -m pip --isolated --disable-pip-version-check install --no-deps "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
          printf 'pip==26.2.2\ncertifi>=2026.10.19\n' > "$RUNNER_TEMP/security-constraints.txt"
          echo "PIP_CONSTRAINT=$RUNNER_TEMP/security-constraints.txt" >> "$GITHUB_ENV"
          python -m pip install 'certifi>=2026.10.19'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python basic/agent_memory.py
      - run: python basic/tenant_rag.py
      # Offline checks only: no API key is configured and no model is called.
      - run: python -m claude_agents.memory_agent
      - run: python -m claude_agents.rag_agent
      - run: python demo/compare_scope.py
      - run: python -m py_compile demo/rag_agent_demo.py  # Live only; needs an API key.
